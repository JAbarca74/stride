# Issuer facts per leveraged ETF (SPEC 1.2, section 7). Versioned on purpose.
#
# Units: expense_ratio and median_spread_30d are fractions (0.0084 = 0.84%);
# aum_usd is net assets in USD. `as_of` is the date of the net-assets figure.
# `source` lists where each value came from.
#
# Pre-filled by the coding agent from SEC EDGAR on 2026-10-19:
#   - expense_ratio: net expense ratio (after waivers) from the latest 497K summary
#     prospectus, or the management fee from the 10-K for commodity pools (UGL, AGQ);
#   - aum_usd: net assets from the latest N-PORT-P, or shareholders' equity from
#     the latest 10-Q for commodity pools.
# median_spread_30d is left for the owner to collect from the issuer pages
# (SEC rule 6c-11). Volatility Shares funds (BITX, ETHU) are left entirely to
# the owner. A null value fails the filters until it is filled in.

