[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride"
version = "0.1.0"
description = "STRIDE — Systematic Trend & Risk-Integrated Daily Execution"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jefferson Abarca" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pandas_market_calendars>=4.4",
    "jinja2>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.30"]
ibkr = ["ib_async>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stride"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
