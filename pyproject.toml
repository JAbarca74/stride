[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stride"
version = "0.1.0"
description = "STRIDE — Systematic Trend & Risk-Integrated Daily Execution"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jefferson Abarca" }]
keywords = [
    "algorithmic-trading",
    "trend-following",
    "risk-management",
    "kelly-criterion",
    "backtesting",
    "quantitative-finance",
    "etf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "pandas_market_calendars>=5.5.0",
    "jinja2>=3.1",
    "matplotlib>=3.11.2",
]

[project.urls]
Homepage = "https://github.com/JAbarca74/stride"
Documentation = "https://github.com/JAbarca74/stride/blob/main/docs/SPEC.md"
Issues = "https://github.com/JAbarca74/stride/issues"

[project.scripts]
stride-data = "stride.data.update:main"

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.44.0"]
ibkr = ["ib_async>=1.0"]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pandas-stubs",
    "hypothesis",
    "types-PyYAML",
    "types-requests",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stride"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pandas_market_calendars", "pandas_market_calendars.*"]
ignore_missing_imports = true
