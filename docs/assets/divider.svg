<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 24" width="960" height="24" role="presentation" aria-hidden="true">
  <style>
    :root { --a:#0969da; --b:#8250df; }
    @media (prefers-color-scheme: dark) { :root { --a:#4493f8; --b:#ab7df8; } }
    .wave { fill:none; stroke:url(#g); stroke-width:2; stroke-linecap:round; stroke-dasharray:6 10; animation:flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-32; } }
    @media (prefers-reduced-motion: reduce) { .wave { animation:none; } }
